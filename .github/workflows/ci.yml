name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dotnet
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet-release.yml@main
    permissions:
      contents: write

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/.nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ts/*.tgz

  npm-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.tgz --repo "$GITHUB_REPOSITORY" --clobber
